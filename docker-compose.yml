version: "3.9"
services:
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: wx-energy-ops:v1.0.0
    container_name: bbva-hvac-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_THRESHOLD=0.30
      - PORT=8000
    restart: unless-stopped

  frontend-ui:
    image: python:3.11.8-slim-bookworm
    container_name: bbva-hvac-frontend
    working_dir: /ui
    volumes:
      - ./frontend:/ui
      - ./requirements.txt:/ui/requirements.txt
    command: >
      sh -c "pip install --no-cache-dir streamlit requests &&
             streamlit run app_ui.py --server.port 8501 --server.address 0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://backend-api:8000
    depends_on:
      - backend-api
